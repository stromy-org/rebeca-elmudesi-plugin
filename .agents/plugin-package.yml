# yaml-language-server: $schema=https://raw.githubusercontent.com/stromy-org/stromy-org/main/scripts/plugin-package.schema.json
# CANONICAL plugin package (ORG-PLAN-165) — the ONLY authored source of this
# plugin's identity, version, targets, skills and marketplace listing. Every
# provider manifest is generated from it: edit here, then run
#   python3 scripts/render-plugin-package.py --write --plugin <this repo>
# (from stromy-org). .copier-answers.yml is template provenance, never release state.
schema_version: 1
identity:
  name: rebeca-elmudesi
  display_name: Rebeca Elmúdesi
  version: 0.3.57
  description: Plugin for Rebeca Elmudesi — branded presentations and documents about her art via stromy-format,
    plus self-service website and brand asset editing via asset-broker
  author:
    name: stromy-org
  repository: https://github.com/stromy-org/rebeca-elmudesi-plugin
  license: UNLICENSED
targets:
- openai
- codex
- claude
- cursor
- copilot
- vscode
- kiro
- gemini
portable_capabilities:
  plugin-workflows:
    summary: Workflows authored for this plugin and shipped inside it
    skills:
    - getting-started
  asset-broker-workflows:
    summary: Workflows on the asset-broker MCP
    skills:
    - asset-editor
    - asset-feedback
    - asset-guide
    - asset-workspace-setup
    mcp_servers:
    - asset-broker
  branded-deliverables:
    summary: Branded documents, decks, charts, diagrams and video rendered server-side in the client's
      brand
    skills:
    - format-prepare-document
    - format-html-hd
    - format-pptx
    - format-docx
    - format-pdf
    - format-pdf-hd
    - format-xlsx
    - format-diagram
    - format-chart
    - format-motion
    - format-video-hd
    - format-guide
    - format-i18n
    mcp_servers:
    - stromy-format
  toolkit-workflows:
    summary: Workflows on the toolkit MCP
    skills:
    - kit-prospect-contact
    mcp_servers:
    - toolkit
skills:
  include:
  - getting-started
  - asset-editor
  - asset-feedback
  - format-prepare-document
  - format-html-hd
  - format-pptx
  - format-docx
  - format-pdf
  - format-pdf-hd
  - format-xlsx
  - format-diagram
  - format-chart
  - format-motion
  - format-video-hd
  - format-guide
  - format-i18n
  - asset-guide
  - asset-workspace-setup
  - kit-prospect-contact
  provider_extras:
  - skill: format-workspace-cowork
    providers:
    - claude
    capability: cowork-workspace
    reason: Co-edits SharePoint workspace artifacts through workspace-scoped tools that exist only in
      a Cowork workspace session.
  - skill: format-workspace-memory
    providers:
    - claude
    capability: cowork-workspace
    reason: Reads and writes the client's SharePoint workspace record through workspace-scoped tools that
      exist only in a Cowork workspace session.
marketplace:
  name: rebeca-elmudesi-marketplace
  repository: https://github.com/stromy-org/rebeca-elmudesi-marketplace
  description: Plugin marketplace for Rebeca Elmudesi plugins
  entry_description: Self-service website and brand asset editing for Rebeca Elmudesi via asset-broker
  owner:
    name: stromy-org
  entry_author:
    name: William Masquelier
